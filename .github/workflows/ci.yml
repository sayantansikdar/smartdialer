# Continuous verification.
#
# Runs on every push and pull request to main.
# Runs typecheck, lint, all test suites, frontend production build, migrations, seeding,
# and all eight verification scenarios across active Node versions (22 and 24).

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['22', '24']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci

      - run: npm run verify
        env:
          NODE_OPTIONS: '--experimental-strip-types'

